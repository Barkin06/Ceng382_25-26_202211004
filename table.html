<!--I asked ChatGPT to create a class input form that asks me the class name number and description and then add these to-->
<!--a table that will have different functionalities that I will describe later.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Class Table</title>
    <link href="https://fonts.googleapis.com/css?family=Redressed|Poppins:400,700" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: #ffffff;
        }

        h1 {
            font-family: 'Redressed', cursive;
            margin-bottom: 20px;
        }

        #class-form {
            background: #e1e0e0;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            max-width: 4000px;
        }

        #class-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        #class-form input,
        #class-form textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            font-family: 'Poppins', sans-serif;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        #class-form button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            font-weight: 700;
            background: #d20c0c;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
        }

        thead {
            background: #000;
            color: #fff;
            cursor: pointer; 
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        tr:hover {
            background: #fd0000;
        }

        .highlight {
            background: #f61606 !important;
        }
    </style>
</head>
<body>

<h1>Class Management</h1>

<div id="class-form">
    <label for="className">Class Name</label>
    <input type="text" id="className" name="className" placeholder="Enter class name...">

    <label for="numPeople">Number of People</label>
    <input type="number" id="numPeople" name="numPeople" placeholder="Enter number of people...">

    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="Enter class description..."></textarea>

    <button id="addClass">Add Class</button>
</div>

<table id="classTable">
    <thead>
        <tr>
            <th>Class Name</th>
            <th id="sortNumber">Number of People ⬍</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody>

    </tbody>
</table>

<script>
    let classData = [];
    let sortAscending = true; 

    const classNameInput = document.getElementById("className");
    const numPeopleInput = document.getElementById("numPeople");
    const descriptionInput = document.getElementById("description");
    const addClassButton = document.getElementById("addClass");
    const classTableBody = document.querySelector("#classTable tbody");
    const sortNumberHeader = document.getElementById("sortNumber");

    //First of all 
    //I asked ChatGPT this part: can you give me the event of focus event that gives me a warning box in input boxes
    // Focus & Blur events
    classNameInput.addEventListener("focus", () => {
        classNameInput.style.outline = "2px solid #d20c0c";
    });
    classNameInput.addEventListener("blur", () => {
        classNameInput.style.outline = "none";
        if (!classNameInput.value.trim()) {
            alert("Please enter a valid class name.");
        }
    });

    numPeopleInput.addEventListener("focus", () => {
        numPeopleInput.style.outline = "2px solid #d20c0c";
    });
    numPeopleInput.addEventListener("blur", () => {
        numPeopleInput.style.outline = "none";
        if (!numPeopleInput.value || parseInt(numPeopleInput.value) < 1) {
            alert("Number of people must be at least 1.");
        }
    });

    descriptionInput.addEventListener("focus", () => {
        descriptionInput.style.outline = "2px solid #d20c0c";
    });
    descriptionInput.addEventListener("blur", () => {
        descriptionInput.style.outline = "none";
        if (!descriptionInput.value.trim()) {
            alert("Please provide a short description.");
        }
    });

    addClassButton.addEventListener("click", (event) => {
        event.preventDefault();

        const nameVal = classNameInput.value.trim();
        const numVal = numPeopleInput.value.trim();
        const descVal = descriptionInput.value.trim();

        if (!nameVal || !numVal || !descVal) {
            alert("Please fill out all fields.");
            return;
        }

        const newClass = {
            name: nameVal,
            num: parseInt(numVal), 
            desc: descVal
        };
        classData.push(newClass);
        updateTable(); 
        classNameInput.value = "";
        numPeopleInput.value = "";
        descriptionInput.value = "";
    });

    function updateTable() {
        classTableBody.innerHTML = ""; 
        classData.forEach((classItem, index) => {
            const newRow = document.createElement("tr");
            newRow.innerHTML = `
                <td>${classItem.name}</td>
                <td>${classItem.num}</td>
                <td>${classItem.desc}</td>
            `;
            newRow.setAttribute("data-index", index);
            classTableBody.appendChild(newRow);
        });
    }

    //I asked ChatGPT this part: can you give me the event of deleting a class(classroom) when I clicked on number with a warning box
    // Click event: Deletes the clicked row
    classTableBody.addEventListener("click", (event) => {
        if (event.target.tagName.toLowerCase() === 'td') {
            const row = event.target.parentNode;
            const rowIndex = row.getAttribute("data-index");

            if (confirm("Are you sure you want to delete this entry?")) {
                classData.splice(rowIndex, 1);
                updateTable();
            }
        }
    });

    //I asked ChatGPT this part: can you give me the event of sorting the number when I click to the table
    // Table Click Event (Sorting)
    sortNumberHeader.addEventListener("click", () => {
        classData.sort((a, b) => sortAscending ? a.num - b.num : b.num - a.num);
        sortAscending = !sortAscending; // Sıralama yönünü tersine çevir
        sortNumberHeader.innerHTML = `Number of People ${sortAscending ? '⬍' : '⬏'}`;
        updateTable();
    });

</script>
</body>
</html>
