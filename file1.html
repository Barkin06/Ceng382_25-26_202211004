<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uchiha Clan Login</title>
    <link href="https://fonts.googleapis.com/css?family=Redressed|Poppins:400,700" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('madaraa.png') center center no-repeat;
            background-size: cover;
            flex-direction: column;
            position: relative;
            font-family: "Poppins", sans-serif; 
        }

        /* Live clock styling: placed above other elements */
        #clock {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            z-index: 9999; /* ensures it's on top */
        }

        .eye {
            position: relative;
            background-color: #d20c0c;
            border: 5px solid #000000;
            border-radius: 50%;
            height: 100px;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .sharingan {
            position: absolute;
            animation: loader 2s infinite linear;
        }

        #pupil {
            fill: black;
        }
        /*sharingan is now even better :)*/
        #iris {
            stroke-width: 8px;
            stroke: rgba(163, 23, 23, 0.75);
            fill: rgba(92, 14, 14, 0.9);
        }

        .iris_anomaly {
            fill: black;
            font-size: 110px;
            font-family: "Redressed", cursive;
        }

        @keyframes loader {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        #login-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            width: 100%;
            position: absolute;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        input {
            margin: 10px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 220px;
            height: 40px;
            background: white;
            color: black;
            font-size: 16px;
            text-align: center;
            font-family: "Poppins", sans-serif;
        }

        .top {
            width: 150px;
            height: 75px;
            background: red;
            border-top-left-radius: 100px;
            border-top-right-radius: 100px;
        }

        .middle {
            width: 150px;
            height: 20px;
            background: black;
        }

        .bottom {
            width: 150px;
            height: 75px;
            background: white;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
        }

        .stick {
            width: 20px;
            height: 50px;
            background: white;
            position: relative;
            left: 65px;
        }

        .button {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Live Clock Container -->
    <div id="clock"></div>

    <div class="eye" id="sharinganButton">
        <svg class="sharingan" viewBox="0 0 100 100" width="100" height="100">
            <g id="full_pupil">
                <circle id="iris" r="30" cx="50" cy="50"></circle>
                <circle id="pupil" r="10" cx="50" cy="50"></circle>
                
                <text id="iris_anomaly" class="iris_anomaly" transform="rotate(180 30,8)">,</text>
                <use href="#iris_anomaly" transform="rotate(120 50,50)" fill="black"></use>
                <use href="#iris_anomaly" transform="rotate(240 50,50)" fill="black"></use>
            </g>
        </svg>
    </div>

    <div id="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="button" onclick="login()" id="loginButton">
            <div class="fan">
                <div class="top"></div>
                <div class="middle"></div>
                <div class="bottom"></div>
                <div class="stick"></div>
            </div>
        </button>
    </div>

    <script>
        let login_attempt = [];
        let sharingan_clicked = false;

        document.getElementById("sharinganButton").addEventListener("click", function() {
            sharingan_clicked = true;
            document.body.style.background = "url('madara.gif') center center no-repeat";
            document.body.style.backgroundSize = "cover";
            document.getElementById("sharinganButton").style.display = "none";
            document.getElementById("login-container").style.display = "flex";
        });

        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var button = document.getElementById("loginButton");

            login_attempt.push({ username: username, password: password });
            
            console.log("Login Attempts: ", login_attempt);

            if (username === "uchiha" && password === "madara") {
                alert("Welcome, Uchiha!");
            } else {
                button.classList.add("shake");
                setTimeout(() => button.classList.remove("shake"), 300);
            }
        }

        // CHATGPT
        //Can you write a Add a live clock to your login page that updates in real time and applies the same fonts and CSS used on my website.
        // Live clock function
        function updateClock() {
            const clockElement = document.getElementById("clock");
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock(); //Every second update it

        //CHATGPT
        // Hide/Show forms with 'H' key
        //Can you write a function that hides everything except watch and gif when I press the "h" button

        let forms_hidden = false;
        let eye_displayold = "";
        let login_displayold = "";

        document.addEventListener("keydown", function(e) {
           
            if (e.key === "h" || e.key === "H") {
                let eyeElem = document.getElementById("sharinganButton");
                let loginCont = document.getElementById("login-container");

                forms_hidden = !forms_hidden;
                if (forms_hidden) {
           
                    eye_displayold = eyeElem.style.display;
                    login_displayold = loginCont.style.display;

                    eyeElem.style.display = "none";
                    loginCont.style.display = "none";
                } else {
       
                    eyeElem.style.display = eye_displayold;
                    loginCont.style.display = login_displayold;
                }
            }
        });
    </script>
</body>
</html>
