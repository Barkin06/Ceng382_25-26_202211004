<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uchiha Clan Login</title>
    <link href="https://fonts.googleapis.com/css?family=Redressed|Poppins:400,700" rel="stylesheet">
    <!--I watched a few tutorials to make sharingan look better so I used "Redressed" font-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('madaraa.png') center center no-repeat;
            background-size: cover;
            flex-direction: column;
            position: relative;
        }

        .eye {
            position: relative;
            background-color: #d20c0c;
            border: 5px solid #000000;
            border-radius: 50%;
            height: 100px;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .sharingan {
            position: absolute;
            animation: loader 2s infinite linear;
        }

        #pupil {
            fill: black;
        }

        #iris {
            stroke-width: 8px;
            stroke: rgba(182, 20, 20, 0.75);
            fill: rgba(136, 20, 20, 0.9);
        }

        .iris_anomaly {
            fill: black;
            font-size: 110px;
            font-family: "Redressed", cursive;
        }

        @keyframes loader {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        /*I asked this part to chatgpt to create an animation and logo(logo was not rigth so I arranged the values)*/
        /*GPT, can you provide me the logo that I sent to you in css and html*/
        #login-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            width: 100%;
            position: absolute;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        input {
            margin: 10px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 220px;
            height: 40px;
            background: white;
            color: black;
            font-size: 16px;
            text-align: center;
            font-family: "Poppins", sans-serif; /*Also you asked a different font, so I changed it*/
        }

        .top {
            width: 150px;
            height: 75px;
            background: red;
            border-top-left-radius: 100px;
            border-top-right-radius: 100px;
        }

        .middle {
            width: 150px;
            height: 20px;
            background: black;
        }

        .bottom {
            width: 150px;
            height: 75px;
            background: white;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
        }

        .stick {
            width: 20px;
            height: 50px;
            background: white;
            position: relative;
            left: 65px;
        }

        .button {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>

<!--This part of code, is taken from chatgpt but it couldnt arrange the values so I arranged them-->
<!--GPT, can you create the html part of the code that remained? But dont touch the values, write them all zero, I will try-->

<body>
    <div class="eye" id="sharinganButton">
        <svg class="sharingan" viewBox="0 0 100 100" width="100" height="100">
            <g id="full_pupil">
                <circle id="iris" r="30" cx="50" cy="50"></circle>
                <circle id="pupil" r="10" cx="50" cy="50"></circle>
                
                <text id="iris_anomaly" class="iris_anomaly" transform="rotate(180 30,8)">,</text>
                <use href="#iris_anomaly" transform="rotate(120 50,50)" fill="black"></use>
                <use href="#iris_anomaly" transform="rotate(240 50,50)" fill="black"></use>
            </g>
        </svg>
    </div>



    <div id="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="button" onclick="login()" id="loginButton">
            <div class="fan">
                <div class="top"></div>
                <div class="middle"></div>
                <div class="bottom"></div>
                <div class="stick"></div>
            </div>
        </button>
    </div>
<!--I asked this part to GPT-->
<!--Gpt, can you please give me a basic login screen functionality and shaking for my button if the entrance is wrong?-->

    <script>
        document.getElementById("sharinganButton").addEventListener("click", function() {
            document.body.style.background = "url('madara.gif') center center no-repeat";
            document.body.style.backgroundSize = "cover";
            document.getElementById("sharinganButton").style.display = "none";
            document.getElementById("login-container").style.display = "flex";
        });

        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var button = document.getElementById("loginButton");
            
            if (username === "uchiha" && password === "madara") {
                alert("Welcome, Uchiha!");
            } else {
                button.classList.add("shake");
                setTimeout(() => button.classList.remove("shake"), 300);
            }
        }
    </script>
</body>
</html>
